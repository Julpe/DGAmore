[default]
# American English is the project's documentation and identifier style.
locale = "en-us"
extend-ignore-words-re = [
    "ba",
    "nd",
    "ix",
    "iy",
    "iz",
    "ket",
    "bse",
    "BSE",
    "gam",
    "mis",
    # the gap's sector parity T O_U (frequency flip times orbital exchange), labeled TOU in gap_parity.txt
    "TOU",
    # numpy exposes the array flag as ``arr.flags.writeable``; not a typo.
    "writeable"
]
