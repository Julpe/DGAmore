# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# mpi4py and psutil are mocked in docs/conf.py (autodoc_mock_imports), so the build
# needs no MPI installation. The package is imported from source via the
# sys.path entry in conf.py, so no editable install of the package is required.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
