# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# mpi4py and psutil are mocked in docs/conf.py (autodoc_mock_imports), so the build
# needs no MPI installation. `uv sync` installs the package for its runtime
# dependencies, together with the `docs` dependency group from pyproject.toml.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
