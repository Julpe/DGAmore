name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ "3.12", "3.13" , "3.14" ]
    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v7
      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      # 3. Install build tools
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel pytest pytest-cov
          pip install mpich mpi4py
      # 4. Install project dependencies (cached via setup-python)
      - name: Install project requirements
        run: |
          pip install -r requirements.txt
      # 5. Build wheel (ensures package is installable)
      - name: Build wheel
        run: |
          python -m build --wheel
      # 6. Install wheel
      - name: Install wheel
        run: |
          pip install $(python -c "import glob; print(glob.glob('dist/*.whl')[0])")
      # 7. Probe MPI initialization (diagnostic). If the runner's MPI_Init is the source of the
      #    intermittent startup SIGTERM (exit 143), this cheap step catches and labels it first.
      - name: Probe MPI initialization
        shell: bash
        run: |
          python -c "from mpi4py import MPI; print('mpi4py lib:', MPI.Get_library_version().splitlines()[0], flush=True)"
          for i in $(seq 1 10); do
            python -c "from mpi4py import MPI; MPI.Get_processor_name(); print('probe', $i, 'MPI_INIT_OK', flush=True)" \
              || { rc=$?; echo "::error::MPI init probe $i failed (exit $rc)"; exit "$rc"; }
          done
      # 8. Run tests with coverage.
      - name: Run tests
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          trap 'echo "::warning::Run tests hit SIGTERM (exit 143); see how far pytest collection/tests got above"; exit 143' TERM INT
          echo "pytest starting; collection imports the package and triggers MPI_Init"
          pytest tests --runslow --cov=dgamore --cov-report=term-missing --cov-report=xml --cov-fail-under=85 -vv
      # 9. Upload coverage to Codecov (requires CODECOV_TOKEN for private repos)
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false