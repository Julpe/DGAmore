name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (Sphinx)
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Set up Python (mirrors the Read the Docs build: Python 3.13)
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'

      # 3. Install documentation dependencies (mpi4py and psutil are mocked in conf.py)
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # 4. Build HTML docs; -W turns warnings into errors, --keep-going reports them all
      - name: Build HTML documentation
        run: |
          sphinx-build -W --keep-going -b html docs docs/_build/html
